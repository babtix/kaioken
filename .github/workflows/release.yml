name: Release

# Pushing a tag like v1.1.0 cross-compiles the CLI for every supported
# platform, stamps the version via ldflags, and publishes a GitHub Release
# with a checksums.txt — the artifacts `kaioken upgrade` consumes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: Build all platforms
        working-directory: cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ../release-out
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            OUT="../release-out/kaioken-v${VERSION}-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && OUT="${OUT}.exe"
            echo "building $OUT"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath \
                -ldflags "-s -w -X kaioken/internal/version.Version=${VERSION}" \
                -o "$OUT" ./cmd/kaioken
          done

      - name: Checksums
        working-directory: release-out
        run: sha256sum * > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*
          generate_release_notes: true
