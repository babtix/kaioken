# ainow configuration — edit freely.
# `notes` are injected into every generation prompt: use them to teach
# the model conventions, guardrails, and tribal knowledge.
version: 1
model: nemotron-3-super:cloud
provider: ollama
base_url: ""
concurrency: 2
max_module_tokens: 60000
scope:
    include: []
    exclude:
        - '**/*.lock'
        - '**/pnpm-lock.yaml'
        - '**/package-lock.json'
        - '**/uv.lock'
        - '**/*.min.js'
        - '**/*.map'
notes: []
