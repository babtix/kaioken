# ainow module plan — generated by `ainow plan`, EDIT FREELY before
# running `ainow generate`. Rename modules, adjust scopes, split or merge.
# Scope entries are repo-relative file paths or directory prefixes.
version: 1
modules:
    - id: ainow
      title: ainow — Terminal AI Coding Assistant & Knowledge Engine
      description: Single Go binary providing an interactive TUI chat agent and a knowledge engine that scans repos, plans modules, and generates knowledge cards.
      scope:
        - README.md
        - go.mod
        - go.sum
        - .claude/
      children:
        - id: cmd
          title: CLI Entry Point
          description: Main command dispatcher wiring subcommands (init, scan, plan, generate, update, status, tui) and the bare TUI launch.
          scope:
            - cmd/ainow/main.go
        - id: tui
          title: Terminal UI (Bubble Tea)
          description: Interactive terminal interface with slash-commands, live streaming progress, model picker, diff approval prompts, and multi-pane layout.
          scope:
            - internal/tui/
        - id: agent
          title: Chat Agent & Tool Execution
          description: Core agent loop that converses with the LLM, executes tool calls (read_file, list_files, search, write_file, edit_file, run_command), and presents diffs for approval.
          scope:
            - internal/agent/
        - id: llm
          title: LLM Provider Abstraction
          description: Provider-agnostic client for OpenAI-compatible endpoints (OpenRouter, OpenAI, Groq, Together, DeepSeek, Mistral, Ollama) with live model catalog fetching.
          scope:
            - internal/llm/
        - id: scan
          title: Repository Scanner
          description: Walks the target repo respecting .gitignore, builds a file inventory, and extracts symbols/structure for downstream planning.
          scope:
            - internal/scan/
        - id: plan
          title: Module Planner
          description: Uses an LLM to propose a hierarchical module tree (modules.yaml) from the scan inventory, with human-in-the-loop editing before generation.
          scope:
            - internal/plan/
        - id: generate
          title: Knowledge Card Generator
          description: Parallel generation of dense knowledge cards per module (overview, architecture, conventions, tech_stack, setup_commands) with incremental rebuilds via content hashes.
          scope:
            - internal/generate/
        - id: config
          title: Configuration Management
          description: Loads and merges .ainow/config.yaml (model, excludes, steering notes) with CLI flags and environment variables.
          scope:
            - internal/config/
        - id: state
          title: State Persistence
          description: Manages .ainow/state.json tracking per-module source hashes to enable incremental updates and freshness status.
          scope:
            - internal/state/
