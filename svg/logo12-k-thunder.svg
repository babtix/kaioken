<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Kaioken Brand Gradients -->
    <linearGradient id="kThunderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe00" />
      <stop offset="45%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#cc0033" />
    </linearGradient>

    <linearGradient id="armGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4400" />
      <stop offset="100%" stop-color="#ffaf00" />
    </linearGradient>

    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pitch Black Canvas -->
  <rect width="512" height="512" fill="#060608" rx="96" />

  <!-- Outer Subtle Tech Border -->
  <rect x="16" y="16" width="480" height="480" fill="none" stroke="#ff5500" stroke-opacity="0.2" stroke-width="2" rx="80" />

  <!-- Logo Group -->
  <g filter="url(#vectorGlow)" transform="translate(10, 0)">
    <!-- Main Stem: Sharp Thunder / Lightning Bolt -->
    <path d="M 210 80 
             L 130 270 
             H 196 
             L 156 432 
             L 270 240 
             H 204 
             Z" 
          fill="url(#kThunderGrad)" />

    <!-- Top Right Arm of 'K' (Geometric Thunder Chevron) -->
    <path d="M 240 250 
             L 364 80 
             H 432 
             L 282 280 
             Z" 
          fill="url(#armGrad)" />

    <!-- Bottom Right Arm of 'K' (Sharp Energy Spear) -->
    <path d="M 272 270 
             L 428 432 
             H 356 
             L 220 305 
             Z" 
          fill="url(#kThunderGrad)" />
  </g>
</svg>
