<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="50%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#dd0033"/>
    </linearGradient>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff0044" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="termGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="80" fill="#08080e"/>
  <rect x="8" y="8" width="496" height="496" rx="72" fill="none" stroke="url(#windowBorder)" stroke-width="2"/>

  <rect x="56" y="56" width="400" height="400" rx="24" fill="#0c0c14" stroke="#ff6600" stroke-opacity="0.25" stroke-width="2"/>

  <rect x="56" y="56" width="400" height="48" rx="24" fill="#111118"/>
  <rect x="56" y="80" width="400" height="24" fill="#111118"/>
  <circle cx="88" cy="80" r="7" fill="#ff3b30"/>
  <circle cx="112" cy="80" r="7" fill="#ff9500"/>
  <circle cx="136" cy="80" r="7" fill="#34c759"/>
  <text x="256" y="86" font-family="monospace" font-size="14" font-weight="700" fill="#666680" text-anchor="middle">kaioken</text>

  <text x="80" y="140" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#ff8800">$</text>
  <text x="100" y="140" font-family="'Courier New', monospace" font-size="16" fill="#888899">kaioken init .</text>
  <text x="80" y="170" font-family="'Courier New', monospace" font-size="14" fill="#44aa55">✓ Project initialized</text>

  <text x="80" y="210" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#ff8800">$</text>
  <text x="100" y="210" font-family="'Courier New', monospace" font-size="16" fill="#888899">kaioken build</text>
  <text x="80" y="240" font-family="'Courier New', monospace" font-size="14" fill="#44aa55">✓ Compiled successfully</text>

  <g filter="url(#termGlow)" opacity="0.12">
    <text x="256" y="380" font-family="system-ui, sans-serif" font-size="280" font-weight="900" fill="url(#termGrad)" text-anchor="middle">K</text>
  </g>

  <text x="80" y="290" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#ff8800">$</text>
  <text x="100" y="290" font-family="'Courier New', monospace" font-size="16" fill="#ccccdd">kaioken agent</text>

  <rect x="232" y="276" width="10" height="18" fill="#ff8800">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <rect x="56" y="420" width="400" height="36" rx="0" fill="#0e0e18"/>
  <rect x="56" y="432" width="400" height="24" rx="24" fill="#0e0e18"/>
  <text x="76" y="443" font-family="monospace" font-size="11" fill="#ff8800" opacity="0.7">●  READY</text>
  <text x="400" y="443" font-family="monospace" font-size="11" fill="#555566" text-anchor="end">v1.0.0</text>
</svg>
