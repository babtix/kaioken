<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="40%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#cc0022"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#0a0a0e"/>
    </linearGradient>
    <linearGradient id="boltFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="30%" stop-color="#ffb800"/>
      <stop offset="70%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#aa0030"/>
    </linearGradient>
    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="shieldClip">
      <path d="M256 36 L440 130 V310 L256 476 L72 310 V130 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#050508"/>

  <path d="M256 36 L440 130 V310 L256 476 L72 310 V130 Z" fill="url(#shieldGrad)" filter="url(#shieldGlow)"/>
  <path d="M256 60 L420 144 V300 L256 450 L92 300 V144 Z" fill="url(#shieldInner)"/>
  <path d="M256 60 L420 144 V300 L256 450 L92 300 V144 Z" fill="none" stroke="#ff6600" stroke-opacity="0.3" stroke-width="1.5"/>

  <g clip-path="url(#shieldClip)" opacity="0.08">
    <line x1="72" y1="180" x2="440" y2="180" stroke="#ff8800" stroke-width="1"/>
    <line x1="72" y1="256" x2="440" y2="256" stroke="#ff8800" stroke-width="1"/>
    <line x1="72" y1="332" x2="440" y2="332" stroke="#ff8800" stroke-width="1"/>
    <line x1="176" y1="36" x2="176" y2="476" stroke="#ff8800" stroke-width="1"/>
    <line x1="256" y1="36" x2="256" y2="476" stroke="#ff8800" stroke-width="1"/>
    <line x1="336" y1="36" x2="336" y2="476" stroke="#ff8800" stroke-width="1"/>
  </g>

  <g filter="url(#shieldGlow)">
    <path d="M280 90 L168 270 H248 L212 420 L356 230 H272 Z" fill="url(#boltFlame)"/>
  </g>
  <path d="M274 110 L190 260 H250 L224 370 L332 244 H268 Z" fill="#ffffff" opacity="0.25"/>

  <circle cx="256" cy="36" r="5" fill="#ffcc00"/>
  <circle cx="440" cy="130" r="5" fill="#ff8800"/>
  <circle cx="440" cy="310" r="5" fill="#ff4400"/>
  <circle cx="256" cy="476" r="5" fill="#cc0022"/>
  <circle cx="72" cy="310" r="5" fill="#ff4400"/>
  <circle cx="72" cy="130" r="5" fill="#ff8800"/>
</svg>
