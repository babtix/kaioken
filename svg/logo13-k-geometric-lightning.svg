<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients matching the image -->
    <linearGradient id="mainOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb700" />
      <stop offset="60%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#e62e00" />
    </linearGradient>

    <linearGradient id="facetRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e61a3c" />
      <stop offset="100%" stop-color="#80001a" />
    </linearGradient>

    <linearGradient id="topArmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5500" />
      <stop offset="70%" stop-color="#ffb700" />
      <stop offset="100%" stop-color="#ffdf73" />
    </linearGradient>

    <linearGradient id="botArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3600" />
      <stop offset="70%" stop-color="#d60029" />
      <stop offset="100%" stop-color="#80001a" />
    </linearGradient>

    <filter id="cleanShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#ff3600" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" fill="#121316" rx="96" />

  <g filter="url(#cleanShadow)" transform="translate(10, -10)">
    <!-- ===== LEFT STEM: LIGHTNING BOLT ===== -->
    <!-- Front Face (Orange/Gold) -->
    <path d="M 130 130 
             H 206 
             L 160 270 
             H 240 
             L 116 450 
             L 170 295 
             H 96 
             Z" 
          fill="url(#mainOrange)" />

    <!-- 3D Bevel / Shadow Facet (Crimson Red) -->
    <path d="M 170 295 
             L 116 450 
             L 240 270 
             H 160 
             Z" 
          fill="url(#facetRed)" opacity="0.9" />

    <!-- ===== TOP RIGHT ARM ===== -->
    <!-- Main Top Arm Polygon (Replacing Flame with Sharp Segment) -->
    <path d="M 196 245 
             L 330 110 
             H 408 
             L 236 270 
             Z" 
          fill="url(#topArmGrad)" />

    <!-- Top Arm Bevel Facet -->
    <path d="M 236 270 
             L 408 110 
             H 380 
             L 196 245 
             Z" 
          fill="url(#facetRed)" opacity="0.4" />

    <!-- ===== BOTTOM RIGHT ARM ===== -->
    <!-- Main Bottom Arm Polygon -->
    <path d="M 205 285 
             L 366 430 
             H 290 
             L 176 320 
             Z" 
          fill="url(#mainOrange)" />

    <!-- Bottom Arm Shadow Facet -->
    <path d="M 205 285 
             L 366 430 
             H 424 
             L 245 285 
             Z" 
          fill="url(#botArmGrad)" />
  </g>
</svg>
