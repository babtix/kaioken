<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffbe00"/>
      <stop offset="45%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8700"/>
      <stop offset="100%" stop-color="#cc0033"/>
    </linearGradient>

    <linearGradient id="bgBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8700" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#331000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0d" stop-opacity="0"/>
    </radialGradient>

    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="800" height="250" rx="32" fill="#0a0a0d"/>
  <rect x="6" y="6" width="788" height="238" rx="26" fill="none" stroke="url(#bgBorderGrad)" stroke-width="2"/>

  <!-- Left Icon Glow & Badge -->
  <circle cx="125" cy="125" r="90" fill="url(#iconGlow)"/>
  
  <g transform="translate(45, 45)" filter="url(#brandGlow)">
    <rect width="160" height="160" rx="36" fill="#121218" stroke="url(#badgeGrad)" stroke-width="2.5"/>
    <path d="M98 24 L46 92 H82 L64 144 L122 76 H86 Z" fill="url(#textGrad)"/>
    <path d="M36 48 L56 64 L36 80" fill="none" stroke="#ffaa00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="62" y1="80" x2="74" y2="80" stroke="#ffaa00" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Name -->
  <text x="240" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="4" fill="url(#textGrad)">KAIOKEN</text>

  <!-- Tagline -->
  <text x="245" y="166" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="14" letter-spacing="3" fill="#ffaa00" opacity="0.9">AGENTIC AI CODING ASSISTANT</text>

  <text x="245" y="188" font-family="'Courier New', Courier, monospace" font-weight="400" font-size="12" letter-spacing="4" fill="#a0a0b0">KNOWLEDGE ENGINE &amp; CLI TOOL SUITE</text>

  <!-- Version Pill -->
  <g transform="translate(680, 45)">
    <rect width="70" height="26" rx="13" fill="#ff5500" fill-opacity="0.15" stroke="#ff5500" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="35" y="17" font-family="monospace" font-weight="700" font-size="12" fill="#ff8700" text-anchor="middle">v1.0</text>
  </g>

  <!-- Decorative Accent Line -->
  <line x1="245" y1="72" x2="750" y2="72" stroke="#ff5500" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6 4"/>
</svg>
