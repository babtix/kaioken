<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Core Kaioken Design System Colors: Red (#ff0000), Orange (#ff8700), Amber (#ffaf00) -->
    <linearGradient id="kaiStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaf00" />
      <stop offset="50%" stop-color="#ff8700" />
      <stop offset="100%" stop-color="#ff0000" />
    </linearGradient>

    <linearGradient id="kaiTopArmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8700" />
      <stop offset="100%" stop-color="#ffaf00" />
    </linearGradient>

    <linearGradient id="kaiBotArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8700" />
      <stop offset="100%" stop-color="#ff0000" />
    </linearGradient>
  </defs>

  <!-- Kaioken Black Background (--kai-black: #080808) -->
  <rect width="512" height="512" fill="#080808" rx="96" />

  <!-- Logo Mark -->
  <g transform="translate(10, -10)">
    <!-- Lightning Bolt Stem -->
    <path d="M 130 130 
             H 206 
             L 160 270 
             H 240 
             L 116 450 
             L 170 295 
             H 96 
             Z" 
          fill="url(#kaiStemGrad)" />

    <!-- Top Right Arm -->
    <path d="M 196 245 
             L 330 110 
             H 408 
             L 236 270 
             Z" 
          fill="url(#kaiTopArmGrad)" />

    <!-- Bottom Right Arm -->
    <path d="M 205 285 
             L 366 430 
             H 290 
             L 176 320 
             Z" 
          fill="url(#kaiBotArmGrad)" />
  </g>
</svg>
