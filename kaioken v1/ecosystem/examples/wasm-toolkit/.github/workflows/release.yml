name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check the tag matches the manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(grep -E '^version:' extension.yaml | awk '{print $2}')"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag v$TAG does not match extension.yaml version $MANIFEST" >&2
            exit 1
          fi
      - name: Verify the committed module matches the source
        # Kaioken installs the source zipball, so dist/plugin.wasm ships in
        # the tree. Rebuilding and comparing keeps the artifact honest.
        run: |
          GOOS=wasip1 GOARCH=wasm go build -trimpath -o /tmp/rebuilt.wasm .
          if ! cmp -s /tmp/rebuilt.wasm dist/plugin.wasm; then
            echo "dist/plugin.wasm does not match a fresh build — rebuild and commit it" >&2
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
