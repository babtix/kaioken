# GoReleaser configuration for Kaioken
# See https://goreleaser.com/docs/configuration/
#
# The Go module lives in cli/, not at the repository root, so every build
# step sets `dir: cli`.

version: 2

# No `before` hooks: they run from the repository root, which has no go.mod,
# so a `go mod tidy` there fails before the build ever starts.

builds:
  - id: "kaioken"
    dir: cli
    main: ./cmd/kaioken
    binary: kaioken
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      # The version is read from kaioken/internal/version, NOT main — setting
      # main.version silently does nothing and leaves released binaries
      # reporting the hard-coded default, which would make every upgrade check
      # compare against the wrong number.
      - -X kaioken/internal/version.Version={{.Version}}

archives:
  # Human-facing archives, and what the package managers consume.
  - id: "kaioken-archive"
    ids:
      - kaioken
    name_template: "{{.Binary}}-v{{.Version}}-{{.Os}}-{{.Arch}}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
    wrap_in_directory: true

  # Bare binaries for `kaioken upgrade`. The self-updater downloads a single
  # executable, so the name here must match selfupdate.AssetName exactly:
  # kaioken-v<version>-<goos>-<goarch>[.exe]. Without this, the updater finds
  # only .tar.gz/.zip archives and reports that no build exists for the
  # running platform.
  - id: "kaioken-binary"
    ids:
      - kaioken
    name_template: "{{.Binary}}-v{{.Version}}-{{.Os}}-{{.Arch}}"
    formats: [binary]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless cosign signature over checksums.txt. Signing the checksum file
# transitively covers every artifact listed in it.
signs:
  - id: "cosign"
    artifacts: checksum
    cmd: "cosign"
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    certificate: "${artifact}.pem"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: babtix
    name: kaioken
  draft: false
  prerelease: auto
  mode: replace

nfpms:
  - id: "kaioken"
    ids:
      - kaioken
    vendor: "Babtix"
    homepage: "https://github.com/babtix/kaioken"
    maintainer: "Babtix <babtix@kaioken.dev>"
    description: "Kaioken - AI coding agent + knowledge engine"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
    bindir: "/usr/local/bin"

# The three publishers below each push to a separate repository that must
# already exist, with a token in secrets. They are the usual reason a first
# release fails; comment one out rather than fighting it if its tap/bucket
# is not set up yet.
#
# Each pins `ids: [kaioken-archive]`: two archives are produced per OS/arch
# (the archive and the bare binary for self-update), and a tap that is handed
# both cannot tell which one to install.
scoops:
  - ids:
      - kaioken-archive
    repository:
      owner: babtix
      name: scoop-bucket
    commit_author:
      name: "Goreleaser Bot"
      email: "goreleaser@babtix.dev"
    homepage: "https://github.com/babtix/kaioken"
    description: "Kaioken - AI coding agent + knowledge engine"
    license: "MIT"

homebrew_casks:
  - ids:
      - kaioken-archive
    repository:
      owner: babtix
      name: homebrew-tap
    commit_author:
      name: "Goreleaser Bot"
      email: "goreleaser@babtix.dev"
    homepage: "https://github.com/babtix/kaioken"
    description: "Kaioken - AI coding agent + knowledge engine"
    license: "MIT"

winget:
  - ids:
      - kaioken-archive
    name: "Kaioken"
    package_identifier: "Babtix.Kaioken"
    publisher: "Babtix"
    repository:
      owner: babtix
      name: winget-pkgs
    commit_author:
      name: "Goreleaser Bot"
      email: "goreleaser@babtix.dev"
    homepage: "https://github.com/babtix/kaioken"
    license: "MIT"
    short_description: "Kaioken - AI coding agent + knowledge engine"
    tags:
      - "ai"
      - "coding"
      - "knowledge"
      - "agent"

snapshot:
  # .Version, not .Tag — .Tag carries the leading "v", which the name
  # templates add themselves and would otherwise double up ("kaioken-vv1.0.0").
  version_template: "{{ .Version }}-next"

announce:
  skip: true
