<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />
    <title>Kaioken</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the stored theme before first paint — prevents a flash of the
      // wrong theme. Mirrors the logic in src/store/theme.ts.
      (function () {
        try {
          if (localStorage.getItem("kai-theme") === "light") {
            document.documentElement.classList.add("light");
            document.querySelector('meta[name="color-scheme"]').content = "light";
            document.querySelector('meta[name="theme-color"]').content = "#f7f7f7";
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
